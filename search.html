<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MiniTab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1c1c1e;
      color: #f2f2f2;
      padding: 20px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 14px;
      color: #9aa0a6;
      letter-spacing: 0.3px;
    }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3a3a3c;
      background: #2c2c2e;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #4a90e2; }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #3a7bc8; }
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-actions button {
      background: #2c2c2e;
      color: #d0d0d0;
      font-weight: 400;
      font-size: 13px;
      border: 1px solid #3a3a3c;
    }
    .quick-actions button:hover { background: #3a3a3c; }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: #6e6e73;
    }
  </style>
</head>
<body>
  <h1>MINITAB · QUICK LOOKUP</h1>
  <form id="search-form">
    <input type="text" id="query" placeholder="Search anything…" autofocus />
    <button type="submit">Go</button>
  </form>
  <div class="quick-actions">
    <button data-query="weather today">Weather</button>
    <button data-query="flight status ">Flight status</button>
    <button data-query="convert currency ">Currency</button>
    <button data-query="define ">Define</button>
  </div>
  <p class="hint">Opens results right here — your current tab stays untouched.</p>
  <script src="search.js"></script>
</body>
</html>
